      loan_amount:
        type: number
      loan_name:
        type: string
      loan_outstanding:
        type: number
      loan_principal_only:
        type: number
      loan_term:
        type: integer
      loan_term_unit:
        type: string
      loan_total_amount:
        type: number
      serial:
        type: string
    type: object
  entity.LoanRepayment:
    properties:
      amount:
        type: number
      id:
        type: integer
      installment_number:
        type: integer
      interest_amount:
        type: number
      loan:
        $ref: '#/definitions/entity.Loan'
      loan_repayment_history_serial:
        type: string
      repayment_amount:
        type: number
      repayment_due_date:
        type: string
      repayment_time:
