definitions:
  entity.GetOutstandingByLoanSerialRequest:
    properties:
      loan_serial:
        type: string
    type: object
  entity.GetRepaymentHistoryListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/entity.LoanRepaymentHistory'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
  entity.GetRepaymentListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/entity.LoanRepayment'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total_data:
        type: integer
      total_page:
        type: integer
    type: object
  entity.IsDelinquentByLoanSerialRequest:
    properties:
      loan_serial:
        type: string
      max_date:
        description: ubah jadi string sementara
        type: string
    type: object
  entity.IsDelinquentByLoanSerialResponse:
    properties:
      is_delinquent:
        type: boolean
      total_unpaid_amount:
        type: number
      unpaid_loan_repayments:
        items:
          $ref: '#/definitions/entity.LoanRepayment'
        type: array
    type: object
  entity.Loan:
    properties:
